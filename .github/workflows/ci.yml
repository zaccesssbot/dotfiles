  # ---------------------------------------------------------------------------------------------
  # apps
  # ---------------------------------------------------------------------------------------------

  raycast:
    name: "raycast: Check extension list format"
    needs: changes
    if: needs.changes.outputs.raycast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/raycast
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check every extension line is slug@author or a // comment
        run: |
          hit=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              //*) continue ;;
              *@*) continue ;;
              *)
                echo "::error file=extensions.txt::malformed line: $line"
                hit=1
                ;;
            esac
          done < extensions.txt
          exit "$hit"

  # RectangleConfig.json must match the shape Rectangle's own Config.swift expects: bundleId,
  # version, shortcuts (name to keyCode and modifierFlags) and defaults (key to a CodableDefault
  # with exactly one of bool, int, float, double or string set)
  rectangle:
    name: "rectangle: Validate Rectangle config"
    needs: changes
    if: needs.changes.outputs.rectangle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/rectangle
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate RectangleConfig.json shape
        run: |
          python3 - <<'PYEOF'
          import json

          with open("RectangleConfig.json") as f:
              config = json.load(f)

          assert config["bundleId"] == "com.knollsoft.Rectangle"
          assert isinstance(config["version"], str)

          for name, shortcut in config["shortcuts"].items():
              assert isinstance(shortcut["keyCode"], int), f"{name}: keyCode must be an int"
              assert isinstance(shortcut["modifierFlags"], int), f"{name}: modifierFlags must be an int"
              assert set(shortcut.keys()) == {"keyCode", "modifierFlags"}, f"{name}: unexpected keys"

          codable_fields = {"bool", "int", "float", "double", "string"}
          for key, value in config["defaults"].items():
              present = [k for k in value if k in codable_fields]
              assert len(present) == 1, f"{key}: must set exactly one of {codable_fields}"
              assert set(value.keys()) <= codable_fields, f"{key}: unexpected keys"

          print("RectangleConfig.json is valid")
          PYEOF

