name: Feature request
description: Propose something new or a change to an alias, setting, key binding or bootstrap step
title: "feat: "
labels: ["enhancement"]
assignees:
  - zaccesss
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: A short sentence explaining what this issue covers.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      description: The folder this issue is about.
      options:
        - shell (profiles, aliases, prompt, zt)
        - setup/mac-bootstrap
        - setup/linux-bootstrap
        - setup/windows-bootstrap
        - setup/defaults
        - terminal/terminal
        - terminal/tmux
        - terminal/btop
        - terminal/cli-tools
        - git/gitconfig
        - git/git-hooks
        - git/ssh
        - editors/vscode
        - editors/zed
        - editors/jetbrains
        - editors/eclipse
        - editors/stm32cubeide
        - editors/xcode
        - editors/neovim
        - editors/arduino
        - editors/microchip-studio
        - editors/kicad
        - editors/vivado
        - editors/processing
        - editors/notepad-plus-plus
        - editors/nextpad-plus-plus
        - editors/thonny
        - editors/matlab
        - editors/ltspice
        - editors/proteus
        - apps/raycast
        - apps/rectangle
        - apps/obsidian
        - apps/zotero
        - The repository as a whole (README, CI, templates)
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What real problem does this solve? See CONTRIBUTING.md's "what belongs here" before opening this.
    validations:
      required: true
  - type: checkboxes
    id: platform
    attributes:
      label: Which platform(s) does it need
      options:
        - label: macOS
        - label: Linux
        - label: Windows
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, related issues, edge cases to watch for.
    validations:
      required: false
