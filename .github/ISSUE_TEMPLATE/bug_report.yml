name: Bug report
description: Report a command, script, setting or key binding that misfires or breaks
title: "fix: "
labels: ["bug"]
assignees:
  - zaccesss
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: A short description of what is broken.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      description: The folder this issue is about.
      options:
        - shell (profiles, aliases, prompt, zt)
        - setup/mac-bootstrap
        - setup/linux-bootstrap
        - setup/windows-bootstrap
        - setup/defaults
        - terminal/terminal
        - terminal/tmux
        - terminal/btop
        - terminal/cli-tools
        - git/gitconfig
        - git/git-hooks
        - git/ssh
        - editors/vscode
        - editors/zed
        - editors/jetbrains
        - editors/eclipse
        - editors/stm32cubeide
        - editors/xcode
        - editors/neovim
        - editors/arduino
        - editors/microchip-studio
        - editors/kicad
        - editors/vivado
        - editors/processing
        - editors/notepad-plus-plus
        - editors/nextpad-plus-plus
        - editors/thonny
        - editors/matlab
        - editors/ltspice
        - editors/proteus
        - apps/raycast
        - apps/rectangle
        - apps/obsidian
        - apps/zotero
        - The repository as a whole (README, CI, templates)
    validations:
      required: true
  - type: checkboxes
    id: platform
    attributes:
      label: Platform
      options:
        - label: macOS
        - label: Linux
        - label: Windows
  - type: input
    id: location
    attributes:
      label: Which file and command, setting or binding
      placeholder: "shell/mac/topics/04-git.zsh gundo, editors/vscode/settings.json editor.fontSize"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS version, shell or tool version, for example macOS 26.0 and zsh 5.9"
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Output, screenshots or related issues.
    validations:
      required: false
